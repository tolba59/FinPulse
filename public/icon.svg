<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#121A2F"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Euro Symbol in subtle slate -->
  <text x="130" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="110" fill="#334155" opacity="0.6">€</text>

  <!-- Dynamic Trend Wave -->
  <path d="M 80 340 Q 150 370 200 300 T 320 220 T 432 150" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Peak Indicator Point -->
  <circle cx="432" cy="150" r="10" fill="#34D399" filter="url(#glow)"/>
  <circle cx="432" cy="150" r="4" fill="#FFFFFF"/>
</svg>
